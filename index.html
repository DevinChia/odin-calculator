<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Odin - Calculator</title>
</head>
<body>
    <div id="container">
        <div class="calculator-display"></div>
        <div class="digits-container">
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>.</button>
        </div>
        <div class="operators-container">
            <button>+</button>
            <button>-</button>
            <br>
            <button>*</button>
            <button>/</button>
        </div>
        <button class="equal-sign">=</button>
        <button class="clear-button">Clear</button>
        <button class="backspace-button">Backspace</button>
    </div>
</body>
</html>
